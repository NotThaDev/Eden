processes:
  containers:
    command: | 
      docker compose up -d \
        && echo "##DOCKER STARTED SUCCESSFULLY##"
    ready_log_line: "##DOCKER STARTED SUCCESSFULLY##"
    shutdown:
      signal: 9
      command: docker compose stop

  frontend:
    working_dir: frontend
    command: bun ci && bun start
    shutdown:
      signal: 9

  migrations:
    working_dir: backend/Eden.Api
    command: |
      dotnet ef database update --connection "Host=localhost;Port=5432;Database=eden;Username=user;Password=password" \
        && echo "##MIGRATIONS RUN SUCCESSFULLY##"
    ready_log_line: "##MIGRATIONS RUN SUCCESSFULLY##"
    shutdown:
      signal: 9
    depends_on:
      containers:
        condition: process_log_ready

  api_service:
    working_dir: backend/Eden.Api
    command: dotnet watch
    shutdown:
      signal: 9
    depends_on:
      containers:
        condition: process_log_ready
      migrations:
        condition: process_completed_successfully
