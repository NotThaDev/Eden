<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <div class="confirmation-message">
    <span>
      {{ data.message }}
    </span>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="text" class="action-button" (click)="dialogRef.close()">Cancel</button>
  <button
    matButton="filled"
    color="warn"
    (click)="onClose()"
    [class]="['confirm-button', 'action-button']"
  >
    Confirm
  </button>
</mat-dialog-actions>
