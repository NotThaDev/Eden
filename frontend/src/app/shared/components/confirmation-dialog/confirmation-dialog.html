<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <div class="confirmation-message">
    <span>
      {{ data.message }}
    </span>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="text" class="action-button" (click)="dialogRef.close()">Annulla</button>
  <button mat-flat-button (click)="onClose()" class="confirm-button action-button">Conferma</button>
</mat-dialog-actions>
