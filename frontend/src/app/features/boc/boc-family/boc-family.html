<app-page-header [title]="'Famiglie'">
  <div class="content-container">
    <div class="toolbar">
      <button matButton="filled" extended (click)="openDialog()">
        <mat-icon>add</mat-icon>
        Nuova Famiglia
      </button>
    </div>

    <nav mat-tab-nav-bar mat-stretch-tabs="false" [tabPanel]="tabPanel">
      <a mat-tab-link [active]="!showOccasional()" (click)="showOccasional.set(false)">
        Assistiti ({{ regularCount() }})
      </a>
      <a mat-tab-link [active]="showOccasional()" (click)="showOccasional.set(true)">
        Saltuari ({{ occasionalCount() }})
      </a>
    </nav>
    <mat-tab-nav-panel #tabPanel>

    <div class="eden-table-container">
      <table mat-table [dataSource]="dataSource" class="eden-table">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let family">{{ family.name }}</td>
        </ng-container>

        <!-- Members Column -->
        <ng-container matColumnDef="members">
          <th mat-header-cell *matHeaderCellDef>Membri</th>
          <td mat-cell *matCellDef="let family">{{ family.members }}</td>
        </ng-container>

        <!-- Children Column -->
        <ng-container matColumnDef="children">
          <th mat-header-cell *matHeaderCellDef>Minori</th>
          <td mat-cell *matCellDef="let family">{{ family.children }}</td>
        </ng-container>

        <!-- ISEE Column -->
        <ng-container matColumnDef="isee">
          <th mat-header-cell *matHeaderCellDef>ISEE</th>
          <td mat-cell *matCellDef="let family">{{ family.isee }}</td>
        </ng-container>

        <!-- Necessity Level Column -->
        <ng-container matColumnDef="necessityLevel">
          <th mat-header-cell *matHeaderCellDef>Grado di Necessità</th>
          <td mat-cell *matCellDef="let family">
            @if (getNecessityGradeLabelProp(family.necessityLevel); as props) {
              <app-label-chip
                [label]="props.label"
                [borderColor]="props.borderColor"
                [backgroundColor]="props.backgroundColor"
                [textColor]="props.textColor"
              >
              </app-label-chip>
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef [style]="{ width: '120px' }"></th>
          <td mat-cell *matCellDef="let family">
            <button matIconButton class="action-button" (click)="editFamily(family)">
              <mat-icon>edit</mat-icon>
            </button>
            <button matIconButton class="action-button" (click)="deleteFamily(family)">
              <mat-icon class="delete-icon">delete_outline</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    </mat-tab-nav-panel>
  </div>
</app-page-header>
