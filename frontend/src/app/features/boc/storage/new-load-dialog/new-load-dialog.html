<h2 mat-dialog-title>Crea un Nuovo Carico</h2>
<div class="form-container">
  <mat-dialog-content [formGroup]="loadFormControl">
    <!-- #TODO Functionality to add future loads? And actually apply them when the time arrives? -->
    <mat-form-field appearance="outline">
      <mat-label>Data Carico</mat-label>
      <input matInput [matDatepickerFilter]="futureDateFilter" [matDatepicker]="picker" formControlName="loadDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="items-section">
      <div class="items-header">
        <h3>Alimenti</h3>
        <button matMiniFab (click)="addItem()" class="add-row-button">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <div formArrayName="items" class="items-container">
        @for (item of items.controls; track $index) {
        <div [formGroupName]="$index" class="item-row">
          <mat-form-field appearance="outline">
            <mat-label>Alimento</mat-label>
            <mat-select formControlName="foodId">
              @for (food of foods(); track food) {
              <mat-option [value]="food.id">{{ food.name }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Quantità</mat-label>
            <input matInput type="number" formControlName="quantity" />
            @if (item.get('quantity')?.hasError('min')) {
            <mat-error>Deve essere almeno 1</mat-error>
            }
          </mat-form-field>

          <button
            matIconButton
            class="delete-row-button"
            (click)="removeItem($index)"
            [disabled]="items.length === 1"
          >
            <mat-icon class="delete-icon">delete_outline</mat-icon>
          </button>
        </div>
        }
      </div>
    </div>
  </mat-dialog-content>
</div>
<mat-dialog-actions>
  <button matButton="text" (click)="dialogRef.close()" class="dialog-button">Annulla</button>
  <button
    matButton="filled"
    class="dialog-button"
    (click)="onSubmit()"
    [disabled]="!loadFormControl.valid"
  >
    Salva
  </button>
</mat-dialog-actions>
