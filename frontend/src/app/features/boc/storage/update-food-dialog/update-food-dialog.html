<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content [formGroup]="foodFormControl">
  <div class="food-form-container">
    <div class="eden-form-field-container">
      <span [style]="{ color: getLabelColor('name') }">Food Name</span>
      <mat-form-field appearance="outline" [style]="{ width: '100%' }">
        <input matInput placeholder="Spaghetti" formControlName="name" />
      </mat-form-field>
    </div>

    <div class="eden-form-field-container">
      <span [style]="{ color: getLabelColor('quantity') }">Quantity Details</span>
      <mat-form-field appearance="outline" [style]="{ width: '100%' }">
        <input matInput type="number" placeholder="4" formControlName="quantity" />
      </mat-form-field>
    </div>

    <div class="eden-form-field-container">
      <span [style]="{ color: getUnitLabelColor() }">Unit Details</span>
      <div class="unit-form-container">
        <mat-form-field appearance="outline">
          <input matInput type="number" placeholder="1.5" formControlName="unitSize" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <input matInput type="text" placeholder="kg" formControlName="unit" />
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="text" (click)="dialogRef.close()" class="dialog-button">Cancel</button>
  <button
    matButton="filled"
    (click)="onClose()"
    class="dialog-button"
    [disabled]="foodFormControl.invalid"
  >
    Save
  </button>
</mat-dialog-actions>
