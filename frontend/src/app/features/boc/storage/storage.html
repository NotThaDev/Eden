<app-drawer
  [isOpen]="selectedFoodId !== null"
  (onClose)="onCloseFoodDetails()"
  [title]="'Storico Carichi'"
>
  @if (selectedFoodId !== null) {
    <app-load-drawer-content [foodId]="selectedFoodId"></app-load-drawer-content>
  }
</app-drawer>

<app-page-header [title]="'Magazzino'">
  <button matButton="filled" (click)="onAddFood()" extended pageActions>
    <mat-icon>add</mat-icon>
    Aggiungi Alimento
  </button>
  <button matButton="filled" extended pageActions (click)="onAddLoad()">
    <mat-icon>local_shipping</mat-icon>
    Nuovo Carico
  </button>
  <div class="eden-table-container">
    <table mat-table [dataSource]="dataSource" class="eden-table">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let food">{{ food.name }}</td>
      </ng-container>

      <!-- Quantity Column -->
      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef>Quantità</th>
        <td mat-cell *matCellDef="let food">{{ food.quantity }}</td>
      </ng-container>

      <!-- Unit / Unit Size Column -->
      <ng-container matColumnDef="unit">
        <th mat-header-cell *matHeaderCellDef>Unità</th>
        <td mat-cell *matCellDef="let food">{{ `${food.unitSize} ${food.unit}` }}</td>
      </ng-container>

      <!-- Latest load -->
      <ng-container matColumnDef="latestLoadId">
        <th mat-header-cell *matHeaderCellDef>Carichi</th>
        <td mat-cell *matCellDef="let food">
          @if (food.latestLoadId) {
            <button matIconButton class="view-load-button" (click)="onViewLoad(food.id)">
              <mat-icon>local_shipping</mat-icon>
            </button>
          } @else {
            <span class="na-label">N/A</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef [style]="{ width: '120px' }"></th>
        <td mat-cell *matCellDef="let food">
          <button matIconButton class="action-button" (click)="onEditFood(food)">
            <mat-icon>edit</mat-icon>
          </button>
          <button matIconButton class="action-button" (click)="onDeleteFood(food)">
            <mat-icon class="delete-icon">delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
</app-page-header>
