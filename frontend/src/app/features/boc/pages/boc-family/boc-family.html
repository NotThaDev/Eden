<app-page-header [title]="'Families'">
  <div class="content-container">
    <div class="toolbar">
      <button matFab extended (click)="onAddFamily()">
        <mat-icon>add</mat-icon>
        Add Family
      </button>
    </div>

    <!-- #TODO Add action column and resize the columns -->
    <table mat-table [dataSource]="dataSource" matSort class="custom-table">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let family">{{ family.name }}</td>
      </ng-container>

      <!-- Members Column -->
      <ng-container matColumnDef="members">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Members</th>
        <td mat-cell *matCellDef="let family">{{ family.members }}</td>
      </ng-container>

      <!-- Children Column -->
      <ng-container matColumnDef="children">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Children</th>
        <td mat-cell *matCellDef="let family">{{ family.children }}</td>
      </ng-container>

      <!-- ISEE Column -->
      <ng-container matColumnDef="isee">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ISEE</th>
        <td mat-cell *matCellDef="let family">{{ family.isee }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
      [style.marginTop.px]="16"
      [pageSizeOptions]="[5, 10, 20]"
      aria-label="Select page of periodic elements"
    >
    </mat-paginator>
  </div>
</app-page-header>
