<app-page-header [title]="'Families'">
  <table mat-table [dataSource]="dataSource" matSort class="table-stripped">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let family">{{ family.name }}</td>
    </ng-container>

    <!-- Members Column -->
    <ng-container matColumnDef="members">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Members</th>
      <td mat-cell *matCellDef="let family">{{ family.members }}</td>
    </ng-container>

    <!-- Children Column -->
    <ng-container matColumnDef="children">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Children</th>
      <td mat-cell *matCellDef="let family">{{ family.children }}</td>
    </ng-container>

    <!-- ISEE Column -->
    <ng-container matColumnDef="isee">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ISEE</th>
      <td mat-cell *matCellDef="let family">{{ family.isee }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Select page of periodic elements"
  >
  </mat-paginator>
</app-page-header>
