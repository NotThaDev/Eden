<app-page-header title="Distribuzioni">
  <div class="header-actions">
    <button matButton="filled" (click)="onNewDistribution()">
      <mat-icon>add</mat-icon>
      Nuova Distribuzione
    </button>
  </div>

  @if (distributions().length === 0) {
    <div class="empty-wrapper">
      <empty-state description="Non sono presenti distribuzioni"></empty-state>
    </div>
  } @else {
    @for (distribution of distributions(); track distribution.id) {
      <accordion
        [title]="titleTemplate"
        [key]="'distribution-details-' + (distribution.id ?? $index)"
        [style]="getAccordionStyle($index)"
      >
        <div class="distribution-actions">
          <button matButton="outlined" (click)="onExportSheets(distribution)">
            <mat-icon>download</mat-icon>
            Esporta schede
          </button>
        </div>
        <distribution-table [distribution]="distribution"></distribution-table>
      </accordion>

      <ng-template #titleTemplate>
        <div class="distribution-title">
          <div class="distribution-title-text">
            <span class="distribution-date-text">
              {{ distribution.distributionDate | date: 'dd/MM/yyyy' }}
            </span>
            <span class="distribution-families">
              {{ distribution.items.length }}
              {{ distribution.items.length === 1 ? 'famiglia' : 'famiglie' }}
            </span>
          </div>
          <app-label-chip
            class="distribution-status"
            [label]="
              isDistributionPast(distribution.distributionDate) ? 'Conclusa' : 'In programma'
            "
            [backgroundColor]="
              getDistributionChipColors(distribution.distributionDate).backgroundColor
            "
            [borderColor]="getDistributionChipColors(distribution.distributionDate).borderColor"
            [textColor]="getDistributionChipColors(distribution.distributionDate).textColor"
          ></app-label-chip>
        </div>
      </ng-template>
    }
  }
</app-page-header>
